# Copy this to secrets.yaml and fill in real values. secrets.yaml is git-ignored.
# In the HA ESPHome dashboard, use the "Secrets" button instead (same format).
wifi_ssid: "YourWifiName"          # must be 2.4 GHz, the ESP32-S3 has no 5 GHz
wifi_password: "YourWifiPassword"
ap_password: "change-me-fallback"
# Generate with: python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_key: "PASTE_32_BYTE_BASE64_KEY"
# Remote WebView server (host:port of the esphome/remote-webview container, use the IP)
webview_server: "YourDockerHostIP:8081"
# Page the WebView shows, e.g. http://<ha-ip>:8123/lovelace/default_view
webview_url: "http://YourHomeAssistantIP:8123/lovelace/default_view"
# Display frame service (Display Frame page): its address (esphome/display-frame, use the IP) and the
# default page it renders
display_frame_server: "http://YourDockerHostIP:28240"
display_frame_url: "http://YourHomeAssistantIP:8123/lovelace/default_view"
