# Display frame service the Display Frame page fetches frames from, e.g. "http://192.168.29.127:28240"
# (secrets.yaml). The page it renders is the "Display Frame URL" entity, editable from HA.
substitutions:
  display_frame_server: !secret display_frame_server

esphome:
  name: cgotchi
  friendly_name: Cheeko
  includes:
    - face_colors.h
  # GPIO 2 latches power OFF if driven HIGH (SKILL.md Gotcha 8). Force it LOW
  # as early as possible so the device never cuts its own power.
  on_boot:
    - priority: 800
      then:
        - switch.turn_off: power_off_latch
    # The display uses update_interval: never, so draw the test screen once
    # after everything (including the panel) has finished setting up.
    - priority: -100
      then:
        - component.update: lcd

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # matches firmware/hardware_test
  framework:
    type: esp-idf
    # Needed by the remote_webview component (WebSocket client + JPEG tile decoder).
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
    components:
      - name: "espressif/esp_websocket_client"
        ref: 1.5.0
      - name: "bitbank2/jpegdec"
        source: https://github.com/strange-v/jpegdec-esphome

# Patched copy of github.com/strange-v/RemoteWebViewClient: adds active/set_active() so the
# web page and the lambda-drawn pages can share the panel, and flip_x. See remote_webview/README.md.
external_components:
  - source:
      type: local
      path: components
    components: [remote_webview]

# Octal PSRAM is mandatory on this board (SKILL.md Gotcha 1).
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # board uses the S3's native USB, not a UART chip

api:
  encryption:
    key: !secret api_key

# `encryption:` with no key reuses the API key, so OTA uploads are encrypted too.
ota:
  - platform: esphome
    encryption:
    on_begin:
      - lambda: |-
          id(ota_state) = 1;
          id(ota_pct) = 0;
      - component.update: lcd
    on_progress:
      - lambda: |-
          // Redraw every 5% only: the device is busy receiving the image.
          const int p = (int) x;
          if (p / 5 != id(ota_pct) / 5 || p >= 100) {
            id(ota_pct) = p;
            id(lcd).update();
          }
    on_error:
      - lambda: |-
          id(ota_state) = 2;
      - component.update: lcd
      - delay: 5s
      - lambda: |-
          id(ota_state) = 0;
      - component.update: lcd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device makes its own hotspot so you can still reach it.
  ap:
    ssid: "Cheeko Gotchi Fallback"
    password: !secret ap_password

captive_portal:

# One I2C bus shared by touch, both audio codecs and the accelerometer.
i2c:
  id: bus_a
  sda: 12
  scl: 11
  frequency: 400kHz
  scan: true     # prints every chip it finds in the log; expect 0x15 0x18 0x19 0x40

# CST810 touch. ESPHome's cst816 driver rejects its chip ID, so skip the probe; the register
# layout (touch count at 0x02, X at 0x03/04, Y at 0x05/06) matches. Raw axes are swapped vs the
# display (SKILL.md section 5: raw Y -> screen X, raw X -> screen Y inverted). The calibration is
# a first guess from that section's measurements; tune it with the touch log (VERBOSE) if taps
# on the WebView page land off target.
touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_a
    skip_probe: true
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: 300
      y_min: 0
      y_max: 260
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          level: VERBOSE
          format: "touch x=%d y=%d raw x=%d y=%d"
          args: ["touch.x", "touch.y", "touch.x_raw", "touch.y_raw"]
    # Taps belong to the WebView page (forwarded by remote_webview). Pages change with a long
    # press of Volume Down or the Display Page select in HA.

# ---------------------------------------------------------------- display
# 240x296 ST7789-class panel, no MISO. MADCTL 0x40 = mirror X, RGB order,
# no inversion (SKILL.md section 4). Portrait only; landscape needs offsets.
spi:
  clk_pin: 9
  mosi_pin: 10

font:
  - file: "gfonts://Roboto"
    id: font_clock
    size: 72
  - file: "gfonts://Roboto"
    id: font_med
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 20

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    dimensions:
      width: 240
      height: 296
    cs_pin: 14
    dc_pin: 8
    reset_pin: 17
    data_rate: 40MHz
    color_order: bgr           # rgb shows red and blue swapped on this unit (blue preset came out yellow)
    invert_colors: false
    transform:                 # all three keys are required once transform is used
      swap_xy: false
      mirror_x: true           # MADCTL 0x40 (SKILL.md section 4); false shows every page flipped left to right
      mirror_y: false
    update_interval: never     # redraws come from entity changes, the minute tick and the talking-mouth interval
    auto_clear_enabled: false  # the lambda fills the screen itself; the WebView page must not be cleared
    lambda: |-
      const Color BG(0, 0, 0), FG(255, 255, 255), ACCENT(0, 200, 255), DIM(130, 130, 130);

      // Volume popup: a bar and percentage for 1.5 s after a volume button press (show_volume
      // script). Kept inside the bottom safe margin because the screen corners are cropped.
      const bool vol_vis = (int32_t) (id(vol_until) - millis()) > 0;
      auto draw_volume = [&]() {
        const int pct = (int) roundf(id(gotchi_player).volume * 100.0f);
        it.filled_rectangle(12, 244, 216, 38, BG);
        it.rectangle(12, 244, 216, 38, DIM);
        it.rectangle(24, 255, 130, 16, FG);
        it.filled_rectangle(26, 257, (126 * pct) / 100, 12, ACCENT);
        it.printf(192, 263, id(font_small), FG, TextAlign::CENTER, "%d%%", pct);
      };

      const uint32_t up = millis();
      const bool booting = up < 2600;                        // wake-up animation after power on
      // Voice replies play as announcements (ANNOUNCING), media from HA as PLAYING.
      const auto mp = id(gotchi_player).state;
      const bool speaking = !booting && (mp == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                         mp == media_player::MEDIA_PLAYER_STATE_ANNOUNCING);
      int page = id(page_sel).active_index().value_or(0);   // 0 Face, 1 Clock, 2 Message, 3 Display Frame, 4 WebView
      const int expr = booting ? 0 : id(face_sel).active_index().value_or(0);  // 0 happy 1 sad 2 sleepy 3 surprised
      const int va = id(va_state);                           // 0 idle, 1 listening, 2 thinking, 3 replying, 4 error

      // The WebView page is drawn by the remote_webview component straight to the panel, so
      // this lambda must draw nothing while it shows. The voice assistant, audio and firmware
      // updates take the screen back: set_active(false) waits for a tile already being drawn.
      const bool webview = page == 4 && va == 0 && !booting && !speaking && id(ota_state) == 0;
      id(rwv).set_active(webview && !vol_vis);
      if (webview) {
        // While the volume popup shows, the tiles are paused and only the popup is drawn over
        // the page; set_active(true) then requests a full frame, which repaints the page.
        if (vol_vis) draw_volume();
        return;
      }

      it.fill(BG);

      // Firmware update: progress bar replaces everything else.
      if (id(ota_state) != 0) {
        if (id(ota_state) == 2) {
          it.print(120, 120, id(font_med), Color(255, 80, 80), TextAlign::TOP_CENTER, "Update failed");
          return;
        }
        const int pct = id(ota_pct);
        it.print(120, 80, id(font_med), ACCENT, TextAlign::TOP_CENTER, "Updating");
        it.rectangle(20, 140, 200, 18, DIM);
        it.filled_rectangle(22, 142, (196 * pct) / 100, 14, ACCENT);
        it.printf(120, 175, id(font_med), FG, TextAlign::TOP_CENTER, "%d%%", pct);
        it.print(120, 250, id(font_small), DIM, TextAlign::TOP_CENTER, "Don't unplug");
        return;
      }

      // Audio can play over the frame, but the voice assistant still takes the screen.
      if (page == 3 && va == 0 && !booting) {
        const int vs = id(frame_state);
        if (vs == 1) {
          it.image(0, 0, id(frame_img));
        } else if (vs == 0) {
          it.print(120, 140, id(font_med), DIM, TextAlign::CENTER, "Loading...");
        } else {
          it.print(120, 130, id(font_med), FG, TextAlign::CENTER, "No frame");
          it.print(120, 170, id(font_small), DIM, TextAlign::CENTER, "check Frame URL");
        }
        if (vol_vis) draw_volume();
        return;
      }
      if (speaking || booting || va != 0) page = 0;          // face talks while audio plays

      if (page == 0) {
        // The face color is chosen in HA; the clock, message and OTA screens keep the blue ACCENT.
        const auto &fc = id(face_color).remote_values;
        const Color ACCENT((uint8_t) (fc.get_red() * 255), (uint8_t) (fc.get_green() * 255), (uint8_t) (fc.get_blue() * 255));
        const int cx = 120, ey = 110;
        // Curved mouth: dir +1 smile, -1 frown.
        auto curve = [&](int cy, int w, int h, int dir) {
          int px = cx - w, py = cy;
          for (int i = 1; i <= 24; i++) {
            float t = i / 24.0f;
            int x = cx - w + (int) (2 * w * t);
            int y = cy + dir * (int) (h * sinf(t * M_PI));
            for (int k = 0; k < 4; k++) it.line(px, py + k, x, y + k, ACCENT);
            px = x; py = y;
          }
        };
        // Eyes
        if (va == 1) {                                       // listening: wide eyes, pulsing rings
          const int pulse = (millis() / 250) % 3 * 3;
          it.circle(cx - 45, ey, 26 + pulse, ACCENT);
          it.circle(cx + 45, ey, 26 + pulse, ACCENT);
          it.filled_circle(cx - 45, ey, 14, ACCENT);
          it.filled_circle(cx + 45, ey, 14, ACCENT);
        } else if (va == 2) {                                // thinking: eyes glance up and aside
          it.filled_circle(cx - 40, ey - 12, 13, ACCENT);
          it.filled_circle(cx + 50, ey - 12, 13, ACCENT);
        } else if (expr == 2) {                              // sleepy: closed lines
          it.filled_rectangle(cx - 62, ey - 3, 34, 6, ACCENT);
          it.filled_rectangle(cx + 28, ey - 3, 34, 6, ACCENT);
        } else if (expr == 3) {                              // surprised: big rings
          it.circle(cx - 45, ey, 26, ACCENT);
          it.circle(cx + 45, ey, 26, ACCENT);
          it.filled_circle(cx - 45, ey, 9, ACCENT);
          it.filled_circle(cx + 45, ey, 9, ACCENT);
        } else {
          const int er = (booting && up < 1200) ? 2 + (int) (14 * up / 1200) : 16;   // eyes open on boot
          it.filled_circle(cx - 45, ey, er, ACCENT);
          it.filled_circle(cx + 45, ey, er, ACCENT);
        }
        // Mouth
        if (booting && up < 1200) {
          // eyes still opening, no mouth yet
        } else if (speaking) {
          it.filled_circle(cx, 200, 10 + ((millis() / 180) % 3) * 8, ACCENT);
        } else if (va == 1) {                                // listening: small open mouth
          it.filled_circle(cx, 205, 9, ACCENT);
        } else if (va == 2) {                                // thinking: three dots, one lit at a time
          const int lit = (millis() / 350) % 3;
          for (int d = 0; d < 3; d++) it.filled_circle(cx - 28 + d * 28, 205, d == lit ? 9 : 5, ACCENT);
        } else if (expr == 0) {
          curve(185, 55, 30, 1);
        } else if (expr == 1) {
          curve(215, 55, 30, -1);
        } else if (expr == 2) {
          it.circle(cx, 205, 9, ACCENT);
        } else {
          it.filled_circle(cx, 205, 20, ACCENT);
        }
        if (speaking) it.print(cx, 262, id(font_small), DIM, TextAlign::TOP_CENTER, "speaking...");
        else if (va == 1) it.print(cx, 262, id(font_small), ACCENT, TextAlign::TOP_CENTER, "listening...");
        else if (va == 2) it.print(cx, 262, id(font_small), DIM, TextAlign::TOP_CENTER, "thinking...");
        else if (va == 4) it.print(cx, 262, id(font_small), Color(255, 80, 80), TextAlign::TOP_CENTER, "voice error");
        if (booting && up >= 1200) it.print(cx, 255, id(font_med), ACCENT, TextAlign::TOP_CENTER, "Hello!");
      } else if (page == 1) {
        auto now = id(ha_time).now();
        if (now.is_valid()) {
          char hm[8];
          if (id(clock_fmt_sel).active_index().value_or(0) == 1) {     // 24 hour
            snprintf(hm, sizeof(hm), "%02d:%02d", now.hour, now.minute);
          } else {                                                     // 12 hour, no AM/PM
            int hour12 = now.hour % 12;
            if (hour12 == 0) hour12 = 12;
            snprintf(hm, sizeof(hm), "%d:%02d", hour12, now.minute);
          }
          it.print(120, 90, id(font_clock), ACCENT, TextAlign::TOP_CENTER, hm);
          it.strftime(120, 180, id(font_med), FG, TextAlign::TOP_CENTER, "%a %d %b", now);
        } else {
          it.print(120, 130, id(font_med), DIM, TextAlign::TOP_CENTER, "waiting for time");
        }
      } else {
        it.print(120, 24, id(font_med), ACCENT, TextAlign::TOP_CENTER, id(msg_title).state.c_str());
        it.filled_rectangle(20, 64, 200, 2, DIM);
        // Word-wrap the body at 18 characters per line.
        const std::string body = id(msg_body).state;
        std::string word, line;
        int y = 80;
        auto emit = [&](const std::string &s) {
          it.print(18, y, id(font_small), FG, TextAlign::TOP_LEFT, s.c_str());
          y += 26;
        };
        for (size_t i = 0; i <= body.size(); i++) {
          char c = i < body.size() ? body[i] : ' ';
          if (c != ' ') { word += c; continue; }
          if (word.empty()) continue;
          // A word longer than one line (e.g. a URL) is split instead of running off-screen.
          while (word.size() > 18) {
            if (!line.empty()) { emit(line); line.clear(); }
            emit(word.substr(0, 18));
            word.erase(0, 18);
          }
          if (!line.empty() && line.size() + 1 + word.size() > 18) { emit(line); line = word; }
          else { line += (line.empty() ? "" : " "); line += word; }
          word.clear();
        }
        if (!line.empty()) emit(line);
      }
      if (vol_vis) draw_volume();

# ------------------------------------------------------------------ frame
# JPEG snapshots fetched one after another and drawn full screen (a few fps, no
# audio). Frames must already be 240x296; see display-frame/.
http_request:
  timeout: 5s
  buffer_size_rx: 4096

image:
  - platform: online_image
    id: frame_img
    url: "http://homeassistant.local:8123/lovelace/default_view"
    format: JPEG
    type: RGB565
    resize: 240x296
    update_interval: never
    on_download_finished:
      - lambda: |-
          id(frame_state) = 1;
          id(frame_errors) = 0;
      - component.update: lcd
      - script.execute:
          id: fetch_next
          wait_ms: !lambda 'return cached ? 250 : 50;'   # cached: server answered 304
    on_error:
      - lambda: |-
          // Three failures in a row, so one dropped frame does not flash "No frame".
          if (++id(frame_errors) >= 3) id(frame_state) = 2;
      - component.update: lcd
      - script.execute:
          id: fetch_next
          wait_ms: 1000

script:
  # Resume on-device wake word listening after the reply has played, but only in Wake Word Mode.
  - id: start_wake_word
    mode: restart
    then:
      # Mic and speaker share one I2S bus. on_end fires before the reply finishes playing, so
      # wait for playback to start and end before the wake word takes the mic back.
      - wait_until:
          condition:
            not:
              media_player.is_idle: gotchi_player
          timeout: 5s            # no reply (error, cancelled): carry on
      - wait_until:
          condition:
            media_player.is_idle: gotchi_player
          timeout: 60s
      - delay: 300ms
      - if:
          condition:
            switch.is_on: wake_word_mode
          then:
            - micro_wake_word.start:

  # Volume popup: the display lambda draws the bar while vol_until is in the future, then this
  # redraws once more so the popup disappears.
  - id: show_volume
    mode: restart
    then:
      - delay: 60ms              # let the media player apply the new volume first
      - lambda: |-
          id(vol_until) = millis() + 1500;
      - component.update: lcd
      - delay: 1560ms
      - component.update: lcd
  # The next download must not start inside the callbacks above: the component tears
  # down its connection right after they return, which aborts the new download and
  # releases the image (black screen). Running from a script defers it.
  # Frame address = display-frame service (display_frame_server secret) + the page to render, which is the
  # "Display Frame URL" entity so it can be changed from HA. The page is percent-encoded into ?url=.
  - id: apply_frame_url
    then:
      - online_image.set_url:
          id: frame_img
          url: !lambda |-
            static const char *HEX = "0123456789ABCDEF";
            // A bundled page (preset names are [a-z0-9_-]) or, for Custom, the Display Frame URL.
            const std::string src = id(frame_src).current_option().str();
            if (src != "Custom") return std::string("${display_frame_server}/frame.jpg?page=") + src;
            std::string out = std::string("${display_frame_server}") + "/frame.jpg?url=";
            for (unsigned char c : id(frame_url).state) {
              if (isalnum(c) || c == '-' || c == '_' || c == '.' || c == '~') {
                out += (char) c;
              } else {
                out += '%';
                out += HEX[c >> 4];
                out += HEX[c & 15];
              }
            }
            return out;
  - id: fetch_next
    mode: restart
    parameters:
      wait_ms: int
    then:
      - delay: !lambda 'return wait_ms;'
      - if:
          condition:
            lambda: 'return id(page_sel).active_index().value_or(0) == 3;'
          then:
            - component.update: frame_img

# ---------------------------------------------------------------- webview
# An HA dashboard rendered by the Remote WebView server (esphome/remote-webview/) and streamed
# as JPEG tiles. Taps go to the page. Starts paused: the lambda above turns it on while the
# WebView page shows. Long press Volume Down to change page.
remote_webview:
  id: rwv
  display_id: lcd
  server: !secret webview_server
  url: !secret webview_url
  active: false
  flip_x: false              # the panel's own mirror_x covers it; see components/remote_webview/README.md
  tile_size: 16
  full_frame_tile_count: 1
  max_bytes_per_msg: 61440
  jpeg_quality: 85
  big_endian: true
  stats_interval: 10s
  current_url_sensor:
    name: "WebView Current URL"

# ---------------------------------------------- display controls (from HA)
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - component.update: lcd
    on_time:
      - seconds: 0               # clock page only changes once a minute
        then:
          - component.update: lcd

select:
  - platform: template
    name: "Display Page"
    id: page_sel
    options: [Face, Clock, Message, Display Frame, WebView]
    initial_option: Face
    optimistic: true
    restore_value: false       # always boot on Face
    on_value:
      - lambda: |-
          if (x == "Display Frame") {
            id(frame_state) = 0;
            id(frame_errors) = 0;
          }
      - component.update: lcd
      # Fetching runs only while this page is Display Frame: start it on entry, it stops itself on exit.
      - if:
          condition:
            lambda: 'return x == "Display Frame";'
          then:
            - script.execute: apply_frame_url
  # Pages bundled with the display-frame service (its /presets list replaces these options a few
  # seconds after boot) or Custom, which uses the Display Frame URL text below.
  - platform: template
    name: "Display Frame Source"
    id: frame_src
    options: [clock, Custom]
    initial_option: clock
    optimistic: true
    restore_value: false       # the option list changes, so a saved index would not be reliable
    on_value:
      - if:
          condition:
            lambda: 'return id(page_sel).active_index().value_or(0) == 3;'
          then:
            - script.execute: apply_frame_url
  - platform: template
    name: "Clock Format"
    id: clock_fmt_sel
    options: ["12 hour", "24 hour"]
    initial_option: "12 hour"
    optimistic: true
    restore_value: true        # kept in flash (NVS), survives reboots and OTA
    on_value:
      - component.update: lcd
  - platform: template
    name: "Face Color Preset"
    id: face_preset_sel
    options: [Blue, Green, Pink, Orange, Purple, Red, Yellow, White, Custom]
    initial_option: Blue
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          // Custom keeps whatever the Face Color picker holds.
          for (const auto &p : FACE_PRESETS) {
            if (x == p.name) {
              auto call = id(face_color).turn_on();
              call.set_rgb(p.r, p.g, p.b);
              call.set_transition_length(0);
              call.perform();
            }
          }
  - platform: template
    name: "Face Expression"
    id: face_sel
    options: [Happy, Sad, Sleepy, Surprised]
    initial_option: Happy
    optimistic: true
    restore_value: true
    on_value:
      - component.update: lcd

text:
  # Change the dashboard from HA without reflashing (not kept across reboots; the
  # webview_url substitution is the default).
  - platform: template
    name: "WebView URL"
    id: webview_url_text
    mode: text
    max_length: 255
    optimistic: true
    restore_value: false
    initial_value: !secret webview_url
    set_action:
      - lambda: |-
          if (!id(rwv).open_url(x)) {
            id(rwv).set_url(x);
            ESP_LOGI("webview", "not connected yet, URL queued");
          }
  - platform: template
    name: "Display Frame URL"
    id: frame_url
    mode: text
    max_length: 255
    optimistic: true
    restore_value: true
    initial_value: !secret display_frame_url
    set_action:
      # Takes effect at once when the Display Frame page is showing; otherwise on next entry.
      - if:
          condition:
            lambda: 'return id(page_sel).active_index().value_or(0) == 3;'
          then:
            - script.execute: apply_frame_url
  - platform: template
    name: "Message Title"
    id: msg_title
    mode: text
    max_length: 16
    optimistic: true
    restore_value: true
    initial_value: "Hello"
    on_value:
      - component.update: lcd
  - platform: template
    name: "Message Body"
    id: msg_body
    mode: text
    max_length: 120
    optimistic: true
    restore_value: true
    initial_value: "Set me from Home Assistant"
    on_value:
      - component.update: lcd

# ------------------------------------------------------------------ audio
# One I2S bus shared by playback (ES8311) and capture (ES7210).
# The ES8311 cannot record; all capture goes through the ES7210 (SKILL.md).
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: 16
    i2s_bclk_pin: 15
    i2s_mclk_pin: 5

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: 6
    dac_type: external
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: 7
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit

sensor:
  # Loudness in dB so you can watch the mic react in HA.
  # Passive: only measures while something else (e.g. the voice assistant) is
  # capturing. A non-passive meter holds the I2S bus open and blocks the speaker.
  - platform: sound_level
    id: noise_meter
    microphone: mic
    passive: true
    rms:
      name: "Mic Level"

# -------------------------------------------------------- switches / inputs
# Lets HA play audio / TTS on the device: Media browser, tts.speak, announcements.
media_player:
  - platform: speaker
    name: "Speaker"
    id: gotchi_player
    volume_increment: 0.05     # step per volume-button press (20 even steps, about 3 dB each)
    # The ES8311 register is linear in dB (0.75 = 0 dB): below 0.3 is inaudible, above 0.8 clips.
    # The player rescales its 0-100% into this window, so every step is audible and clean.
    volume_min: 0.3
    volume_max: 0.8
    announcement_pipeline:
      speaker: spk
      format: FLAC
      sample_rate: 16000
      num_channels: 1

# On-device wake word. HA lists these models in the device's "Wake word" select because it is
# linked to voice_assistant below. Runs only while the "Wake Word Mode" switch is on.
micro_wake_word:
  id: mww
  microphone: mic
  models:
    - okay_nabu
    - hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# Voice assistant: hold Volume Up to talk, or turn on the "Wake Word Mode" switch in HA to
# listen for the wake word instead. HA's Assist pipeline (speech to text, conversation
# agent, text to speech) and the wake word are chosen in the device's settings in HA.
# Replies play through the Speaker media player above.
voice_assistant:
  id: va
  microphone: mic
  media_player: gotchi_player
  micro_wake_word: mww
  use_wake_word: false         # wake word is detected on the device, not by HA
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: |-
        id(va_state) = 1;
    - component.update: lcd
  on_stt_vad_end:
    - lambda: |-
        id(va_state) = 2;
    - component.update: lcd
  on_tts_end:
    - lambda: |-
        id(va_state) = 3;
    - component.update: lcd
  on_error:
    - lambda: |-
        id(va_state) = 4;
    - component.update: lcd
    - delay: 3s
    - lambda: |-
        id(va_state) = 0;
    - component.update: lcd
    - script.execute: start_wake_word
  on_end:
    - delay: 100ms
    - lambda: |-
        if (id(va_state) != 4) id(va_state) = 0;
    - component.update: lcd
    - script.execute: start_wake_word

output:
  - platform: ledc
    id: backlight_pwm
    pin: 13                    # LCD backlight enable, HIGH = on
    frequency: 1000Hz
  - platform: template
    id: face_r
    type: float
    write_action: []
  - platform: template
    id: face_g
    type: float
    write_action: []
  - platform: template
    id: face_b
    type: float
    write_action: []

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s   # no fade, snappy dimming

  # Face color picker. The outputs are dummies: the light only stores the color the display reads.
  - platform: rgb
    name: "Face Color"
    id: face_color
    red: face_r
    green: face_g
    blue: face_b
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    initial_state:
      color_mode: rgb
      red: 0%
      green: 78%
      blue: 100%
    on_state:
      - lambda: |-
          // Mirror the picker into the preset select: a matching preset, else Custom.
          const auto &v = id(face_color).remote_values;
          const char *match = "Custom";
          size_t match_idx = sizeof(FACE_PRESETS) / sizeof(FACE_PRESETS[0]);   // Custom is the last option
          for (size_t i = 0; i < match_idx; i++) {
            const auto &p = FACE_PRESETS[i];
            if (fabsf(v.get_red() - p.r) < 0.02f && fabsf(v.get_green() - p.g) < 0.02f &&
                fabsf(v.get_blue() - p.b) < 0.02f) {
              match = p.name;
              match_idx = i;
              break;
            }
          }
          if (id(face_preset_sel).active_index().value_or(match_idx + 1) != match_idx)
            id(face_preset_sel).make_call().set_option(match).perform();
      - component.update: lcd

switch:
  # Off: push-to-talk only. On: the on-device wake word also listens. Remembered across reboots.
  - platform: template
    name: "Wake Word Mode"
    id: wake_word_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.start:
    turn_off_action:
      - micro_wake_word.stop:

  # Mirrors the WebView page left to right in software. Normally off (the display's mirror_x
  # already orients every page); a debugging aid if only the web page ever looks flipped.
  # Not remembered: it is off after every reboot.
  - platform: template
    name: "WebView Flip X"
    id: webview_flip
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(rwv).set_flip_x(true);
          id(rwv).refresh();
    turn_off_action:
      - lambda: |-
          id(rwv).set_flip_x(false);
          id(rwv).refresh();

  - platform: gpio
    id: power_off_latch
    pin: 2
    restore_mode: ALWAYS_OFF
    internal: true             # hidden from HA on purpose: turning it on kills power

  - platform: gpio
    id: speaker_amp
    pin: 4                     # NS4150B amp enable, HIGH = on
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    name: "Volume Up"
    pin:
      number: 40
      mode: INPUT_PULLUP
      inverted: true           # active LOW
    filters:
      - delayed_on_off: 20ms   # debounce
    on_click:
      - min_length: 20ms         # short press: volume up
        max_length: 600ms
        then:
          - media_player.volume_up: gotchi_player
          - script.execute: show_volume
      - min_length: 700ms        # long press: push-to-talk, press again to cancel
        max_length: 10s
        then:
          - if:
              condition:
                lambda: 'return id(va_state) != 0;'
              then:
                - voice_assistant.stop:     # cancel an active conversation
              else:
                - micro_wake_word.stop:          # free the mic for push-to-talk
                - voice_assistant.start:

  - platform: gpio
    name: "Volume Down"
    pin:
      number: 39
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - min_length: 20ms         # short press: volume down
        max_length: 600ms
        then:
          - media_player.volume_down: gotchi_player
          - script.execute: show_volume
      - min_length: 700ms        # long press: next page (Face, Clock, Message, Display Frame, WebView)
        max_length: 10s
        then:
          - select.next:
              id: page_sel
              cycle: true

# No middle-button sensor: it feeds the power circuit and never reaches GPIO 3 on this unit (hardware_test's PWR indicator stays dark too).

globals:
  - id: was_speaking
    type: bool
    initial_value: "false"
  - id: va_state               # voice assistant: 0 idle, 1 listening, 2 thinking, 3 replying, 4 error
    type: int
    initial_value: "0"
  - id: ota_state              # 0 idle, 1 updating, 2 failed
    type: int
    initial_value: "0"
  - id: ota_pct
    type: int
    initial_value: "0"
  - id: frame_state            # 0 loading, 1 playing, 2 no frame
    type: int
    initial_value: "0"
  - id: frame_errors           # consecutive failed fetches
    type: int
    initial_value: "0"
  - id: frame_presets          # page names from the display-frame service, then "Custom"
    type: std::vector<std::string>
  - id: frame_presets_loaded
    type: bool
    initial_value: "false"
  - id: vol_until              # millis() until which the volume popup shows
    type: uint32_t
    initial_value: "0"

interval:
  # Until it succeeds, ask the display-frame service which pages it bundles and offer them in the
  # Display Frame Source select. Fails quietly while Wi-Fi or the service is down.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return !id(frame_presets_loaded);'
          then:
            - http_request.get:
                url: "${display_frame_server}/presets"
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        id(frame_presets).clear();
                        if (response->status_code == 200) {
                          size_t start = 0;
                          while (start < body.size()) {
                            size_t end = body.find('\n', start);
                            if (end == std::string::npos) end = body.size();
                            if (end > start) id(frame_presets).push_back(body.substr(start, end - start));
                            start = end + 1;
                          }
                        }
                    - if:
                        condition:
                          lambda: 'return !id(frame_presets).empty();'
                        then:
                          - lambda: |-
                              id(frame_presets).push_back("Custom");
                              id(frame_presets_loaded) = true;
                              // The select keeps pointers into frame_presets, which is not changed again.
                              FixedVector<const char *> opts;
                              opts.init(id(frame_presets).size());
                              for (const auto &name : id(frame_presets)) opts.push_back(name.c_str());
                              id(frame_src).traits.set_options(opts);
                              id(frame_src).publish_state(id(frame_presets)[0]);
  - interval: 100ms            # frames for the boot animation (first ~2.6 s after power on)
    then:
      - lambda: |-
          if (millis() < 2800) id(lcd).update();
  - interval: 200ms           # animate the talking mouth while audio plays, plus one redraw when it stops
    then:
      - lambda: |-
          const auto mp = id(gotchi_player).state;
          const bool playing = mp == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                               mp == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          if (playing || id(va_state) == 1 || id(va_state) == 2 || playing != id(was_speaking)) id(lcd).update();
          id(was_speaking) = playing;
