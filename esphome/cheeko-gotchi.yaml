# Stage 2/3: hardware bring-up. Display, speaker, mic, buttons, backlight.
# Pins come from SKILL.md section 2 (verified on real hardware).

esphome:
  name: cgotchi
  friendly_name: Cheeko
  # GPIO 2 latches power OFF if driven HIGH (SKILL.md Gotcha 8). Force it LOW
  # as early as possible so the device never cuts its own power.
  on_boot:
    - priority: 800
      then:
        - switch.turn_off: power_off_latch
    # The display uses update_interval: never, so draw the test screen once
    # after everything (including the panel) has finished setting up.
    - priority: -100
      then:
        - component.update: lcd

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # matches firmware/hardware_test
  framework:
    type: esp-idf

# Octal PSRAM is mandatory on this board (SKILL.md Gotcha 1).
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # board uses the S3's native USB, not a UART chip

api:
  encryption:
    key: !secret api_key

# `encryption:` with no key reuses the API key, so OTA uploads are encrypted too.
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi fails, the device makes its own hotspot so you can still reach it.
  ap:
    ssid: "Cheeko Gotchi Fallback"
    password: !secret ap_password

captive_portal:

# One I2C bus shared by touch, both audio codecs and the accelerometer.
i2c:
  id: bus_a
  sda: 12
  scl: 11
  frequency: 400kHz
  scan: true     # prints every chip it finds in the log; expect 0x15 0x18 0x19 0x40

# ---------------------------------------------------------------- display
# 240x296 ST7789-class panel, no MISO. MADCTL 0x40 = mirror X, RGB order,
# no inversion (SKILL.md section 4). Portrait only; landscape needs offsets.
spi:
  clk_pin: 9
  mosi_pin: 10

font:
  - file: "gfonts://Roboto"
    id: font_clock
    size: 72
  - file: "gfonts://Roboto"
    id: font_med
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 20

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    dimensions:
      width: 240
      height: 296
    cs_pin: 14
    dc_pin: 8
    reset_pin: 17
    data_rate: 40MHz
    color_order: rgb
    invert_colors: false
    transform:                 # all three keys are required once transform is used
      swap_xy: false
      mirror_x: true
      mirror_y: false
    update_interval: never     # redraws come from entity changes, the minute tick and the talking-mouth interval
    lambda: |-
      const Color BG(0, 0, 0), FG(255, 255, 255), ACCENT(0, 200, 255), DIM(130, 130, 130);
      it.fill(BG);
      const bool speaking = id(gotchi_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
      int page = id(page_sel).active_index().value_or(0);   // 0 Face, 1 Clock, 2 Message
      const int expr = id(face_sel).active_index().value_or(0);  // 0 happy 1 sad 2 sleepy 3 surprised
      if (speaking) page = 0;                                // face talks while audio plays

      if (page == 0) {
        const int cx = 120, ey = 110;
        // Curved mouth: dir +1 smile, -1 frown.
        auto curve = [&](int cy, int w, int h, int dir) {
          int px = cx - w, py = cy;
          for (int i = 1; i <= 24; i++) {
            float t = i / 24.0f;
            int x = cx - w + (int) (2 * w * t);
            int y = cy + dir * (int) (h * sinf(t * M_PI));
            for (int k = 0; k < 4; k++) it.line(px, py + k, x, y + k, ACCENT);
            px = x; py = y;
          }
        };
        // Eyes
        if (expr == 2) {                                     // sleepy: closed lines
          it.filled_rectangle(cx - 62, ey - 3, 34, 6, ACCENT);
          it.filled_rectangle(cx + 28, ey - 3, 34, 6, ACCENT);
        } else if (expr == 3) {                              // surprised: big rings
          it.circle(cx - 45, ey, 26, ACCENT);
          it.circle(cx + 45, ey, 26, ACCENT);
          it.filled_circle(cx - 45, ey, 9, ACCENT);
          it.filled_circle(cx + 45, ey, 9, ACCENT);
        } else {
          it.filled_circle(cx - 45, ey, 16, ACCENT);
          it.filled_circle(cx + 45, ey, 16, ACCENT);
        }
        // Mouth
        if (speaking) {
          it.filled_circle(cx, 200, 10 + ((millis() / 180) % 3) * 8, ACCENT);
        } else if (expr == 0) {
          curve(185, 55, 30, 1);
        } else if (expr == 1) {
          curve(215, 55, 30, -1);
        } else if (expr == 2) {
          it.circle(cx, 205, 9, ACCENT);
        } else {
          it.filled_circle(cx, 205, 20, ACCENT);
        }
        if (speaking) it.print(cx, 262, id(font_small), DIM, TextAlign::TOP_CENTER, "speaking...");
      } else if (page == 1) {
        auto now = id(ha_time).now();
        if (now.is_valid()) {
          it.strftime(120, 90, id(font_clock), ACCENT, TextAlign::TOP_CENTER, "%H:%M", now);
          it.strftime(120, 180, id(font_med), FG, TextAlign::TOP_CENTER, "%a %d %b", now);
        } else {
          it.print(120, 130, id(font_med), DIM, TextAlign::TOP_CENTER, "waiting for time");
        }
      } else {
        it.print(120, 24, id(font_med), ACCENT, TextAlign::TOP_CENTER, id(msg_title).state.c_str());
        it.filled_rectangle(20, 64, 200, 2, DIM);
        // Word-wrap the body at 18 characters per line.
        const std::string body = id(msg_body).state;
        std::string word, line;
        int y = 80;
        auto emit = [&](const std::string &s) {
          it.print(18, y, id(font_small), FG, TextAlign::TOP_LEFT, s.c_str());
          y += 26;
        };
        for (size_t i = 0; i <= body.size(); i++) {
          char c = i < body.size() ? body[i] : ' ';
          if (c != ' ') { word += c; continue; }
          if (word.empty()) continue;
          // A word longer than one line (e.g. a URL) is split instead of running off-screen.
          while (word.size() > 18) {
            if (!line.empty()) { emit(line); line.clear(); }
            emit(word.substr(0, 18));
            word.erase(0, 18);
          }
          if (!line.empty() && line.size() + 1 + word.size() > 18) { emit(line); line = word; }
          else { line += (line.empty() ? "" : " "); line += word; }
          word.clear();
        }
        if (!line.empty()) emit(line);
      }

# ---------------------------------------------- display controls (from HA)
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - component.update: lcd
    on_time:
      - seconds: 0               # clock page only changes once a minute
        then:
          - component.update: lcd

select:
  - platform: template
    name: "Display Page"
    id: page_sel
    options: [Face, Clock, Message]
    initial_option: Face
    optimistic: true
    restore_value: true
    on_value:
      - component.update: lcd
  - platform: template
    name: "Face Expression"
    id: face_sel
    options: [Happy, Sad, Sleepy, Surprised]
    initial_option: Happy
    optimistic: true
    restore_value: true
    on_value:
      - component.update: lcd

text:
  - platform: template
    name: "Message Title"
    id: msg_title
    mode: text
    max_length: 16
    optimistic: true
    restore_value: true
    initial_value: "Hello"
    on_value:
      - component.update: lcd
  - platform: template
    name: "Message Body"
    id: msg_body
    mode: text
    max_length: 120
    optimistic: true
    restore_value: true
    initial_value: "Set me from Home Assistant"
    on_value:
      - component.update: lcd

# ------------------------------------------------------------------ audio
# One I2S bus shared by playback (ES8311) and capture (ES7210).
# The ES8311 cannot record; all capture goes through the ES7210 (SKILL.md).
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: 16
    i2s_bclk_pin: 15
    i2s_mclk_pin: 5

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: 6
    dac_type: external
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: 7
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit

sensor:
  # Loudness in dB so you can watch the mic react in HA.
  # Passive: only measures while something else (e.g. the voice assistant) is
  # capturing. A non-passive meter holds the I2S bus open and blocks the speaker.
  - platform: sound_level
    id: noise_meter
    microphone: mic
    passive: true
    rms:
      name: "Mic Level"

# -------------------------------------------------------- switches / inputs
# Lets HA play audio / TTS on the device: Media browser, tts.speak, announcements.
media_player:
  - platform: speaker
    name: "Speaker"
    id: gotchi_player
    announcement_pipeline:
      speaker: spk
      format: FLAC
      sample_rate: 16000
      num_channels: 1

switch:
  - platform: gpio
    id: power_off_latch
    pin: 2
    restore_mode: ALWAYS_OFF
    internal: true             # hidden from HA on purpose: turning it on kills power

  - platform: gpio
    name: "Backlight"
    id: backlight
    pin: 13
    restore_mode: ALWAYS_ON    # visible in HA, toggle it to prove HA controls hardware

  - platform: gpio
    id: speaker_amp
    pin: 4                     # NS4150B amp enable, HIGH = on
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    name: "Volume Up"
    pin:
      number: 40
      mode: INPUT_PULLUP
      inverted: true           # active LOW
    filters:
      - delayed_on_off: 20ms   # debounce

  - platform: gpio
    name: "Volume Down"
    pin:
      number: 39
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms

  - platform: gpio
    name: "Middle Button"
    pin:
      number: 3
      mode:
        input: true
        pulldown: true         # active HIGH (not inverted); hardware_test also enables the internal pulldown
    filters:
      - delayed_on_off: 20ms

# Debug for the middle button: log the raw GPIO 3 level whenever it changes.
# If this never prints a change while you press it, the signal isn't reaching GPIO 3.
globals:
  - id: last_gpio3
    type: int
    initial_value: "-1"
  - id: was_speaking
    type: bool
    initial_value: "false"

interval:
  - interval: 200ms            # animate the talking mouth while audio plays, plus one redraw when it stops
    then:
      - lambda: |-
          const bool playing = id(gotchi_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          if (playing || playing != id(was_speaking)) id(lcd).update();
          id(was_speaking) = playing;
  - interval: 50ms
    then:
      - lambda: |-
          int lvl = gpio_get_level((gpio_num_t) 3);
          if (lvl != id(last_gpio3)) {
            id(last_gpio3) = lvl;
            ESP_LOGW("gpio3", "raw level = %d", lvl);
          }
