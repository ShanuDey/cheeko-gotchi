# Test firmware: shows a web page (e.g. an HA dashboard) on the panel through the
# Remote WebView server (esphome/remote-webview/). View only for now: the CST810
# touch chip is not supported by ESPHome's touchscreen platforms, so no taps yet.
# This REPLACES cheeko-gotchi.yaml on the device (same name, flash over OTA); flash
# cheeko-gotchi.yaml again to go back.

substitutions:
  webview_server: "<server_ip>:8081"   # PC running remote-webview/docker-compose.yaml
  webview_url: "https://example.com"     # replace with the HA dashboard URL

esphome:
  name: cgotchi
  friendly_name: Cheeko
  # GPIO 2 latches power OFF if driven HIGH (SKILL.md Gotcha 8).
  on_boot:
    - priority: 800
      then:
        - switch.turn_off: power_off_latch

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    # From the RemoteWebViewClient README.
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
    components:
      - name: "espressif/esp_websocket_client"
        ref: 1.5.0
      - name: "bitbank2/jpegdec"
        source: https://github.com/strange-v/jpegdec-esphome

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Cheeko Gotchi Fallback"
    password: !secret ap_password

captive_portal:

# Not used by the WebView itself. It makes ESPHome keep mbedtls' TLS layer, which
# esp_websocket_client's esp-tls needs at link time.
http_request:

external_components:
  - source: github://strange-v/RemoteWebViewClient
    components: [remote_webview]

i2c:
  id: bus_a
  sda: 12
  scl: 11
  frequency: 400kHz

# The CST810 reports a chip ID that cst816 does not know, so skip the probe. Its
# register layout (touch count at 0x02, X at 0x03/04, Y at 0x05/06) matches.
# Raw axes are swapped vs the display (SKILL.md section 5: raw Y -> screen X,
# raw X -> screen Y inverted). The raw ranges below are a first guess from that
# section's measured mapping; tune them using the "touch" log lines.
touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_a
    skip_probe: true
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: 300
      y_min: 0
      y_max: 260
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw x=%d y=%d"
          args: ["touch.x", "touch.y", "touch.x_raw", "touch.y_raw"]

spi:
  clk_pin: 9
  mosi_pin: 10

# The component owns the display: no lambda, no pages, no auto clear.
display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    dimensions:
      width: 240
      height: 296
    cs_pin: 14
    dc_pin: 8
    reset_pin: 17
    data_rate: 40MHz
    color_order: rgb
    invert_colors: false
    transform:
      swap_xy: false
      mirror_x: true           # the remote_webview tiles came out flipped left to right
      mirror_y: false
    update_interval: never
    auto_clear_enabled: false
    show_test_card: false

remote_webview:
  id: rwv
  display_id: lcd
  server: ${webview_server}
  url: ${webview_url}
  tile_size: 16
  full_frame_tile_count: 1
  max_bytes_per_msg: 61440
  jpeg_quality: 85
  big_endian: true
  stats_interval: 10s
  current_url_sensor:
    name: "WebView Current URL"

# Change the page from HA without reflashing.
text:
  - platform: template
    name: "WebView URL"
    id: webview_url_text
    mode: text
    max_length: 255
    optimistic: true
    restore_value: false
    initial_value: ${webview_url}
    set_action:
      - lambda: |-
          if (!id(rwv).open_url(x)) {
            id(rwv).set_url(x);
            ESP_LOGI("webview", "not connected yet, URL queued");
          }

output:
  - platform: ledc
    id: backlight_pwm
    pin: 13
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

switch:
  - platform: gpio
    id: power_off_latch
    pin: 2
    restore_mode: ALWAYS_OFF
    internal: true
