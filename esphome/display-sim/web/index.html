<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Display simulator</h1>
    <div class="header-right">
      <span id="status" class="status" role="status">Connecting</span>
      <button type="button" id="restart" title="Rebuilds and reopens the simulator, to pick up edits to the face component">
        Restart simulator
      </button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Face</h2>
      <h3>Expression</h3>
      <div id="expressions" class="chips" role="group" aria-label="Expression"></div>
      <h3>Voice state</h3>
      <div id="voices" class="chips" role="group" aria-label="Voice state"></div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="speaking"><span>Speaking</span></label>
      </div>
    </section>

    <section class="card">
      <h2>Look</h2>
      <h3>Color</h3>
      <div id="colors" class="swatches" role="group" aria-label="Color"></div>
      <h3>Frame rate <output id="fps-value"></output></h3>
      <input type="range" id="fps" aria-label="Frame rate">
    </section>
  </main>

  <p class="footnote">These controls set the same settings Home Assistant sets on the device. To change
    how a face looks, edit <code>components/face/looks.h</code>, then press Restart simulator.</p>

  <script type="module" src="app.js"></script>
</body>
</html>
